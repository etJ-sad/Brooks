# Limine configuration. This file sits on the FAT32 partition of the USB-SSD
# (\boot\limine\limine.conf) and can be edited from Windows.
#
# Kernel cmdline options:
#   font=auto|8x16|16x32   auto: 16x32 on >=1440p panels (4K), 8x16 otherwise
#   scale=N                integer pixel scale on top of the font (auto shrinks if too big)

timeout: 3
# Bigger menu font on 4K panels.
term_font_scale: 2x2

/AxonOS
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: font=auto scale=1

/AxonOS (force 3840x2160)
    protocol: limine
    path: boot():/boot/kernel.elf
    resolution: 3840x2160
    cmdline: font=auto scale=1

/AxonOS (large text)
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: font=16x32 scale=2
